<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONIX PLAY | OFFICIAL</title>
    <meta name="referrer" content="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo-zoonix.png">
</head>
<body style="background-color: #0d0d0d; color: #ffffff; margin: 0; padding: 0; font-family: 'Roboto', sans-serif;">

    <!-- MODAL DO PLAYER -->
    <div id="playerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:9999; align-items:center; justify-content:center;">
        <div style="position:relative; width:95%; max-width:900px; background:#000; border:2px solid #00d2ff; box-shadow: 0 0 20px #00d2ff;">
            <button onclick="closePlayer()" style="position:absolute; top:-40px; right:0; background:none; border:none; color:#00d2ff; font-family:'Orbitron'; cursor:pointer; font-weight:900; font-size:16px;">FECHAR [X]</button>
            <div style="width: 100%; height: 0; padding-bottom: 56.25%; position: relative; overflow: hidden;">
                <iframe id="videoIframe" src="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" frameborder="0" scrolling="no" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <header style="background: #000; border-bottom: 2px solid #00d2ff; padding: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="img/logo-zoonix.png" alt="Zonix" style="width: 45px;">
                <span style="font-family: 'Orbitron'; color: #00d2ff; font-size: 26px; font-weight: 900; letter-spacing: 2px;">ZONIX PLAY</span>
            </div>
            <nav>
                <a href="index.html" style="color: white; text-decoration: none; font-weight: bold; margin-right: 20px; font-family: 'Orbitron'; font-size: 14px;">INÍCIO</a>
                <a href="pix.html" style="background: #00d2ff; color: #000; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; font-family: 'Orbitron';">DOAR PIX</a>
            </nav>
        </div>
    </header>

    <main style="display: flex; flex-wrap: wrap; gap: 25px; max-width: 1200px; margin: 30px auto; padding: 0 20px;">
        
        <!-- COLUNA JOGOS -->
        <div style="flex: 2; min-width: 320px;">
            <div style="background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 25px; text-align: center; border-left: 5px solid #00ff00;">
                <p style="margin: 0; font-size: 15px; font-weight: bold;">🟢 <span id="pessoal-online" style="color: #00ff00;">1</span> pessoas assistindo agora</p>
            </div>

            <h3 style="font-family: 'Orbitron'; color: #00d2ff; border-left: 4px solid #00d2ff; padding-left: 15px; margin-bottom: 20px; text-transform: uppercase;">Partidas Disponíveis</h3>
            <div id="lista-jogos">
                <!-- Injetado via JS -->
            </div>
        </div>

        <!-- COLUNA CHAT -->
        <aside style="flex: 1; min-width: 320px;">
            <h3 style="font-family: 'Orbitron'; color: #00d2ff; font-size: 16px; margin-bottom: 15px; text-align: center;">CHAT DA GALERA</h3>
            <div style="background: #1a1a1a; border: 2px solid #00d2ff; border-radius: 12px; padding: 5px; height: 550px; overflow: hidden; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);">
                <!-- Chat alternativo estável (Meutube) -->
                <iframe src="https://www.chatwee.com/public/chat/663409ae985e05001c000001" width="100%" height="100%" frameborder="0"></iframe>
            </div>
        </aside>

    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>

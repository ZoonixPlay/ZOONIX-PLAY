<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONIX PLAY | OFFICIAL</title>
    <meta name="referrer" content="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo-zoonix.png">
</head>
<body>

    <!-- MODAL DO PLAYER -->
    <div id="playerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:9999; align-items:center; justify-content:center;">
        <div style="position:relative; width:95%; max-width:900px; background:#000; border:2px solid #00d2ff;">
            <button onclick="closePlayer()" style="position:absolute; top:-35px; right:0; background:none; border:none; color:#00d2ff; font-family:'Orbitron'; cursor:pointer; font-weight:900;">FECHAR [X]</button>
            <div class="video-mask" style="width: 100%; height: 0; padding-bottom: 56.25%; position: relative; overflow: hidden; background: #000;">
                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 55px; background: #000; z-index: 105;"></div>
                <iframe id="videoIframe" src="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;" frameborder="0" scrolling="no" allowfullscreen playsinline></iframe>
            </div>
        </div>
    </div>

    <header class="navbar">
        <div class="navbar-content container">
            <div class="logo-area">
                <img src="img/logo-zoonix.png" alt="Logo ZONIX PLAY" class="main-logo">
                <span class="site-name-animated">ZONIX PLAY</span>
            </div>
            <nav class="menu">
                <a href="index.html">INÍCIO</a>
                <a href="pix.html" class="btn-top-doe">DOAR</a>
            </nav>
        </div>
    </header>

    <main class="container main-layout" style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
        <!-- LADO ESQUERDO: JOGOS -->
        <div class="content-left" style="flex: 2; min-width: 300px;">
            <div style="background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; color: #fff;">
                <p>🚀 <strong>DICA:</strong> Use o navegador <strong>Brave</strong> para evitar anúncios indesejados!</p>
            </div>

            <div class="online-counter" style="text-align: center; color: #fff; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span style="height: 8px; width: 8px; background-color: #00ff00; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00ff00;"></span>
                <span id="pessoal-online">1</span> pessoas assistindo agora
            </div>

            <section class="welcome-section">
                <h2>Seja bem-vindo ao <span>ZONIX PLAY</span></h2>
                <div class="pix-center-container">
                    <a href="pix.html" class="btn-pix-animated">DOE UM PIX</a>
                </div>
            </section>

            <h3 class="matches-title">PARTIDAS DISPONÍVEIS</h3>
            <div id="lista-jogos" class="jogos-grid"></div>
        </div>

        <!-- LADO DIREITO: CHAT VIA RUMBLE (MUITO ESTÁVEL) -->
        <aside class="chat-sidebar" style="flex: 1; min-width: 300px;">
            <h3 class="matches-title" style="font-size: 14px; margin-bottom: 15px;">CHAT AO VIVO</h3>
            <div class="chat-wrapper" style="background: #0a0a0a; border: 1px solid #00d2ff; border-radius: 10px; overflow: hidden; height: 500px; position: relative;">
                <!-- Chat alternativo via Rumble/Popout (Não cai e não dá 404) -->
                <iframe src="https://vaughn.live/embed/chat/zonixplay" width="100%" height="500" frameborder="0" scrolling="no"></iframe>
            </div>
        </aside>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>

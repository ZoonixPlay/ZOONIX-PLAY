<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoie o Zonix Play</title>
    <link rel="stylesheet" href="css/pix.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pix-container">
        <header>
            <h1 class="logo-text">APOIE O PROJETO</h1>
            <p>Sua doação ajuda a manter o servidor online e sem anúncios travando.</p>
        </header>

        <div class="pix-card">
            <div class="qr-placeholder">
                <img src="img/qrcode.png" alt="QR Code PIX">
            </div>

            <div class="pix-info">
                <span>Chave PIX (E-mail/CPF/Aleatória):</span>
                <div class="copy-box">
                    <input type="text" value="d1a0c1c2-5cae-4b5b-8a27-bcb04a5cd663" id="pixKey" readonly>
                    <button onclick="copiarPix()">COPIAR</button>
                </div>
            </div>

            <a href="index.html" class="btn-voltar">VOLTAR PARA O INÍCIO</a>
        </div>
    </div>

    <script>
        function copiarPix() {
            var copyText = document.getElementById("pixKey");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Chave PIX copiada!");
        }
    </script>
</body>
</html>

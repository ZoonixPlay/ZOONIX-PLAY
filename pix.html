<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOIAR | ZONIX PLAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="navbar-content container">
            <div class="logo-text">ZONIX PLAY</div>
            <a href="index.html" class="btn-voltar">VOLTAR</a>
        </div>
    </header>

    <main class="container">
        <section class="pix-section">
            <h2 class="main-title">APOIE O PROJETO</h2>
            <p class="pix-description">
                Sua doação ajuda a manter os servidores ativos e a transmissão sem anúncios. 
                Qualquer valor é bem-vindo!
            </p>

            <div class="pix-card">
                <div class="pix-header">
                    <span>VIA PIX</span>
                </div>
                
                <!-- QR CODE (Substitua o src pela sua imagem de QR Code) -->
                <div class="qr-container">
                    <img src="img/qrcode.png" alt="QR Code Pix" class="qr-code">
                </div>

                <div class="pix-input-group">
                    <label>CHAVE PIX ALEATORIA:</label>
                    <div class="copy-box">
                        <input type="text" value="d1a0c1c2-5cae-4b5b-8a27-bcb04a5cd663" id="pixKey" readonly>
                        <button onclick="copyPix()">COPIAR</button>
                    </div>
                </div>
            </div>

            <div class="pix-footer-msg">
                Obrigado por fortalecer a comunidade <strong>Zonix Play</strong>!
            </div>
        </section>
    </main>

    <footer class="footer-final">
        <div class="footer-brand">ZONIX PLAY</div>
    </footer>

    <script>
        function copyPix() {
            var copyText = document.getElementById("pixKey");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            document.execCommand("copy");
            alert("Chave Pix copiada com sucesso!");
        }
    </script>
</body>
</html>
